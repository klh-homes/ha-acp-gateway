# Example docker-compose for running Claude Agent (ACP) personas.
#
# Each persona is its own service block: own bearer token, own bake of
# CLAUDE.md + settings.json + skills, own named volume, own port. Multi-
# persona = repeat the block.
#
# This compose builds a per-persona overlay image on top of the upstream
# ha-claude-acp release. The overlay (see examples/personas/voice-assistant/)
# layers persona content + entrypoint helpers; the bake-and-reseed pattern
# keeps the image SHA tracking the persona's contract while a named volume
# holds runtime state (registered MCP servers, etc.).
#
# Operator workflow:
#   1. Copy examples/personas/voice-assistant/ into your deployment repo at
#      `personas/<name>/`. Edit CLAUDE.md, settings.json, Dockerfile.
#   2. Generate one bearer token per persona: openssl rand -hex 32
#   3. Copy this file to your deployment repo and adjust:
#        - the build.context path
#        - container_name / volume name / port (one block per persona)
#        - environment variable names matching your secret store
#   4. `docker compose up -d --build`
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN is shared across personas (one Anthropic
#   account is fine — usage is metered per token). Each persona gets a
#   distinct BEARER_TOKEN so a leaked one only compromises that persona.
#   HA_MCP_URL is consumed at container start by lib/setup-mcp.sh.

services:
  jarvis:
    build:
      context: ./personas/jarvis
      dockerfile: Dockerfile
      args:
        # Pin the upstream release explicitly — :latest moves under you
        # when a new image is published.
        HA_CLAUDE_ACP_VERSION: 0.1.0
    container_name: claude-acp-jarvis
    restart: unless-stopped
    init: true
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      BEARER_TOKEN: ${JARVIS_BEARER_TOKEN}
      HA_MCP_URL: ${HA_MCP_URL}
      LOG_LEVEL: info
    volumes:
      - jarvis_data:/home/node
    ports:
      - '8765:8765'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8765/healthz']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  jarvis_data:
