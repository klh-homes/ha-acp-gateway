name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    name: service (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: integration (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff==0.17.3 black==26.10.1
      - name: ruff
        run: ruff check custom_components
      - name: black
        run: black --check custom_components
